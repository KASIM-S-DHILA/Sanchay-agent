openapi: 3.0.3
info:
  title: Sanchay Commerce API
  version: "1.0.0"
  description: |
    Sanchay is a voice-first shopping counter built on Cloudflare Workers.
    This document describes the REST surface exactly as implemented in
    `src/api/*.ts` and `src/index.ts` — it is written from reading the
    running code, not from an idealized design. Where the implementation
    has quirks or gaps relevant to an API consumer (human or AI agent),
    they are called out explicitly rather than smoothed over.

    ## Conventions
    - All monetary values are **paise** (1/100 INR) unless a field is
      explicitly named `*_display`, `price_display`, or `total_display`,
      which are pre-formatted rupee strings (e.g. `"₹1,999"`) meant for a
      voice agent to speak directly.
    - Every response body has the shape `{ success: boolean, data?: ...,
      error?: string }`.
    - **Business failures are not always HTTP error codes.** Out-of-stock,
      budget-exceeded, "item not in cart", and "cart is empty" all return
      **HTTP 200** with `success: false` and a human-readable `error`
      string — these are normal shopping outcomes, not server errors. Only
      missing/invalid input (400), an invalid/expired session (401), an
      unknown product/order id (404), and upstream payment failures (502)
      use non-200 status codes. Callers must check `success`, not just the
      status code.
    - `x-session-id` is required on every endpoint below except
      `/api/session/start` and `/api/catalog` (optional — an anonymous
      catalog browse is allowed). `/admin/*` uses a separate `X-Admin-Token`
      shared secret instead — see Known gaps.
    - CORS is wildcard (`Access-Control-Allow-Origin: *`) on every response.

    ## Known gaps (documented, not silently fixed)
    - **`/admin/seed-catalog` and `/admin/replace-catalog` require
      `X-Admin-Token`**, matched against the deployed `ADMIN_TOKEN` secret.
      If that secret is not configured, both endpoints are disabled (503)
      rather than left open. There is still no per-operator identity or
      rate limiting behind this — it's a single shared secret, appropriate
      for a small operator team, not a multi-tenant admin model.
    - **`/api/catalog` returns two different product shapes** depending on
      whether a search query was given: the no-query listing uses `id`,
      the search-result path uses `productId` for the same concept. A
      caller (including an AI agent) must handle both field names.
    - `/api/audit` requires a validated `x-session-id` matching the queried
      `session_id` — same as every other commerce endpoint — but still
      returns full request/response bodies for every logged call with no
      PII redaction. A session can read its own complete history in
      detail; there is no cross-session read.
servers:
  - url: https://sanchay.kasimdhila80.workers.dev
    description: Production
  - url: http://127.0.0.1:8787
    description: Local (wrangler dev)

tags:
  - name: Session
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Audit
  - name: Webhooks
  - name: Admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Worker is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/session/start:
    post:
      operationId: startSession
      tags: [Session]
      summary: Start a shopping session
      description: |
        Creates a new session, valid 24 hours. `user_email` is optional; if
        given, cross-session preferences (previously viewed/purchased
        products, budget history) are loaded and returned. No email means
        an anonymous session with `userPreferences: null`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_email:
                  type: string
                  nullable: true
                  description: Optional. Used as the user identity key for cross-session preferences and purchase history.
                budget:
                  type: number
                  description: Optional budget ceiling in paise. Non-positive or non-finite values are ignored (treated as no budget).
      security: []
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      sessionId: { type: string, format: uuid }
                      userPreferences:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/UserPreferences"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/session/end:
    post:
      operationId: endSession
      tags: [Session]
      summary: End a shopping session
      description: |
        Marks the session ended. After this call, the session id is
        rejected (401) by every other endpoint that requires
        `x-session-id`. If the session has an associated email, the final
        cart contents are written back as `previousProducts` for future
        personalization.
      security: [{ SessionHeader: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed_checkout:
                  type: boolean
                  description: Accepted but not currently read by the handler — reserved for future use.
                call_disposition:
                  type: string
                  description: Accepted but not currently read by the handler — reserved for future use.
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/catalog:
    get:
      operationId: searchCatalogGet
      tags: [Catalog]
      summary: Browse or search the catalog
      description: |
        `x-session-id` is optional here — an anonymous browse is allowed
        (logged against an empty session id for audit purposes). Accepts
        query params on GET; the same fields are also accepted as a JSON
        body on POST (Sarvam's voice tool calls always POST).

        **Shape warning:** when `q` is empty, each product has an `id`
        field. When `q` is non-empty (a real search), each product has a
        `productId` field instead, plus extra fields (`description`,
        `score`) that the no-query listing omits. Handle both.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Search text. Empty or omitted returns the full catalog listing instead of running search.
        - name: limit
          in: query
          schema: { type: integer, default: 5, maximum: 20 }
          description: Clamped to 20 server-side. Not validated for negative values beyond the `Math.min` clamp — a negative limit is passed through to the search/SQL layer as-is.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/CatalogResult"
    post:
      operationId: searchCatalogPost
      tags: [Catalog]
      summary: Browse or search the catalog (POST form, used by voice tools)
      description: Identical behavior to GET, but reads `q`/`query` and `limit` from a JSON body instead of query params.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
                query: { type: string, description: "Accepted as an alias for q by the voice tool bridge; the HTTP POST body reader only checks `q`." }
                limit: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/CatalogResult"

  /api/cart:
    get:
      operationId: getCart
      tags: [Cart]
      summary: Get current cart contents
      security: [{ SessionHeader: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CartResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: getCartPost
      tags: [Cart]
      summary: Get current cart contents (POST form)
      description: Identical to GET /api/cart — accepted because some callers/tool runtimes default to POST for every call.
      security: [{ SessionHeader: [] }]
      responses:
        "200":
          $ref: "#/components/responses/CartResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cart/add:
    post:
      operationId: addToCart
      tags: [Cart]
      summary: Add an item to the cart
      description: |
        Stock and budget are enforced atomically against live state — a
        concurrent add cannot oversell stock or exceed budget. Merges into
        an existing line item if the product is already in the cart.

        Quantity must be an integer 1–99 if provided; anything else is a
        400. Omitting quantity defaults to 1.

        Idempotent retries: pass the same `Idempotency-Key` header (or
        `idempotency_key` body field) on a retry to replay the original
        result instead of adding the item twice.
      security: [{ SessionHeader: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Alternative to the idempotency_key body field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, description: "Also accepted as productId (camelCase)." }
                productId: { type: string }
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  default: 1
                idempotency_key: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/CartResult"
        "400":
          description: Missing product_id, or quantity outside 1–99 / not an integer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: product_id does not exist in the catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/cart/remove:
    post:
      operationId: removeFromCart
      tags: [Cart]
      summary: Remove an item from the cart
      description: |
        Omitting `quantity` removes the entire line item. A quantity ≥ the
        current line-item quantity also removes the whole item (does not
        error). Same 1–99 integer validation as add, applied only when a
        quantity is actually supplied.

        "Item not in cart" is a normal outcome (`success: false`, HTTP
        200), not an error.
      security: [{ SessionHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, description: "Also accepted as productId." }
                productId: { type: string }
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  description: Omit to remove the entire line item.
      responses:
        "200":
          $ref: "#/components/responses/CartResult"
        "400":
          description: Quantity outside 1–99 / not an integer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/checkout:
    post:
      operationId: checkout
      tags: [Checkout]
      summary: Checkout the current cart
      description: |
        Idempotent automatically — no key needed. If an order is already
        `created` or `attempted` for this session, that same order is
        returned instead of creating a duplicate. Re-validates stock for
        every cart line at call time; if any item has vanished (stock
        reached 0 since it was added), that item is dropped from the cart
        and the whole checkout attempt fails with `success: false` so the
        shopper can retry.

        `paymentUrl` may be absent even on a successful order — Razorpay's
        test-mode payment-link quota can be exhausted, in which case the
        order is still created (`status: "created"`) but has no
        `paymentUrl`.

        Stock is reserved atomically at checkout time (not on payment) —
        two different sessions racing for the last unit of a product cannot
        both succeed; the loser gets a specific "sold out while checking
        out" error and the item is removed from their cart.

        Every order is also checked against a merchant-configured maximum
        order amount (`MERCHANT_MAX_ORDER_PAISE`, ₹50,000 by default),
        independent of any budget the calling session declared for itself —
        a session/agent cannot raise this ceiling by claiming a higher
        budget. Exceeding it is a graceful `success: false` failure, not an
        exception.
      security: [{ SessionHeader: [] }]
      responses:
        "200":
          description: Order created (or an already-active order returned) — or a graceful business failure (empty cart, item no longer available).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CheckoutSuccess"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Razorpay order creation failed (not payment-link creation — that fails gracefully and is absorbed into a successful response with no paymentUrl).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/order/{orderId}:
    get:
      operationId: getOrderStatus
      tags: [Checkout]
      summary: Get order status
      description: Scoped to the requesting session — an order id belonging to a different session returns 404, not the order.
      security: [{ SessionHeader: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
          description: The Razorpay order id (not Sanchay's internal row id).
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/OrderResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found (or not found for this session)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: getOrderStatusPost
      tags: [Checkout]
      summary: Get order status (POST form)
      security: [{ SessionHeader: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/OrderResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/audit:
    get:
      operationId: getAuditTrail
      tags: [Audit]
      summary: Get the full call log for a session
      description: |
        This is the "explainability" audit trail — every commerce API
        call (including webhook-attributed payment events) for the given
        session, in chronological order, with the full request params and
        response body of each call. There is no redaction of any data that
        was previously sent through `params`/`response` — treat this as
        internal/trusted data for the session's own owner, not public-safe.

        Requires `x-session-id` like every other commerce endpoint, and it
        must match the `session_id` query parameter — there is no
        cross-session audit read; a caller can only read the audit trail
        for the exact session it authenticates as.
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      security: [{ SessionHeader: [] }]
      responses:
        "200":
          description: Event list (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      sessionId: { type: string }
                      events:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
        "400":
          description: Missing session_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /webhooks/razorpay:
    post:
      operationId: razorpayWebhook
      tags: [Webhooks]
      summary: Razorpay payment webhook
      description: |
        HMAC-SHA256 verified against `x-razorpay-signature` using the raw
        request body and `RAZORPAY_WEBHOOK_SECRET`. Only `payment.captured`
        events are acted on (stock decrement, purchase-history update,
        order marked paid); every other event type is acknowledged with
        `{status: "ignored"}` and not otherwise processed. This endpoint is
        called by Razorpay's servers, not by application clients or AI
        agents.
      security: []
      parameters:
        - name: x-razorpay-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Razorpay webhook payload — signature is verified over the exact request body bytes, so this must not be re-serialized before verification.
      responses:
        "200":
          description: Webhook processed or ignored
        "400":
          description: Signature mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /voice:
    get:
      operationId: voiceUpgrade
      tags: [Checkout]
      summary: WebSocket upgrade for the voice bridge
      description: |
        Not a JSON REST endpoint — accepts a WebSocket upgrade only.
        Requesting it without `Upgrade: websocket` returns 426. See the
        AI-agent tool schema (`GET /api/tools`) for the commerce
        operations a voice/LLM agent can invoke; those operations are
        exposed as plain HTTP endpoints above, called directly by Sarvam's
        hosted conversation runtime, not tunneled through this socket.
      parameters:
        - name: session_id
          in: query
          required: false
          schema: { type: string }
          description: Reuse an existing browser session for this voice call instead of minting a new one. If omitted or the id is invalid/expired, a new session is created and owned by this call.
        - name: email
          in: query
          required: false
          schema: { type: string }
      security: []
      responses:
        "101":
          description: WebSocket upgrade established
        "426":
          description: Upgrade header missing
        "502":
          description: Upstream Sarvam connection failed

  /admin/seed-catalog:
    post:
      operationId: seedCatalog
      tags: [Admin]
      summary: (Re)seed the built-in 12-SKU catalog and embed it for search
      description: |
        Requires the `X-Admin-Token` header, matched against the deployed
        `ADMIN_TOKEN` secret. If `ADMIN_TOKEN` is not configured for this
        deployment, this endpoint is disabled entirely (503) rather than
        left open. Idempotent for existing rows (`INSERT OR IGNORE`) except
        that product images are backfilled on every call.
      security: [{ AdminToken: [] }]
      responses:
        "200":
          description: Seed completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      message: { type: string }
        "401":
          description: Missing or incorrect X-Admin-Token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: ADMIN_TOKEN not configured for this deployment — admin endpoints are disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/tools:
    get:
      operationId: getAgentTools
      tags: [Catalog]
      summary: Machine-readable tool schema for AI buyers/agents
      description: |
        Describes the same operations available as Sarvam voice tool calls
        (search_catalog, add_to_cart, remove_from_cart, get_cart, checkout,
        get_order_status), in an LLM tool-calling-compatible JSON Schema
        shape, plus the plain HTTP endpoint equivalent of each. This
        endpoint and `/openapi.yaml` are the two entry points intended for
        an AI shopping agent to discover how to interact with Sanchay.
      security: []
      responses:
        "200":
          description: Tool schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      tools:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            description: { type: string }
                            http_equivalent: { type: string }
                            parameters:
                              type: object
                              description: JSON Schema `object` parameters definition (properties/required), matching common LLM function-calling formats.
                      openapi_spec_url: { type: string, example: /openapi.yaml }
                      notes:
                        type: array
                        items: { type: string }

  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [Catalog]
      summary: This document, served as-is
      description: Returns this OpenAPI spec (the same file committed at the repo root) as `application/yaml`.
      security: []
      responses:
        "200":
          description: OpenAPI 3.0 document
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    SessionHeader:
      type: apiKey
      in: header
      name: x-session-id
      description: Session id returned by POST /api/session/start. Rejected with 401 if missing, unknown, expired (24h TTL), or already ended.
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Operator shared secret, matched against the deployed ADMIN_TOKEN. Gates /admin/* only — never used by end-user/session-scoped endpoints.

  responses:
    Unauthorized:
      description: Missing, unknown, expired, or already-ended session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CatalogResult:
      description: Product list — see the shape warning in the endpoint description above.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                properties:
                  query: { type: string }
                  products:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/CatalogListItem"
                        - $ref: "#/components/schemas/CatalogSearchItem"
    CartResult:
      description: Cart contents (also returned by add/remove on success)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data: { $ref: "#/components/schemas/CartResponse" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }

    UserPreferences:
      type: object
      properties:
        preferredCategories: { type: array, items: { type: string } }
        budgetPreference: { type: integer, nullable: true, description: paise }
        previousProducts: { type: array, items: { type: string }, description: Product ids from the shopper's last session's final cart. }
        purchaseHistory:
          type: array
          items: { type: string }
          description: Product ids ever paid for by this email, deduplicated.
        sessionCount: { type: integer }
        lastActive: { type: string, format: date-time, nullable: true }

    CatalogListItem:
      type: object
      description: Shape returned when q is empty (full listing).
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer, description: paise }
        stock: { type: integer }
        category: { type: string }
        image_url: { type: string, nullable: true }
        price_display: { type: string, example: "₹1,999" }

    CatalogSearchItem:
      type: object
      description: Shape returned when q is a real search term.
      properties:
        productId: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: integer, description: paise }
        category: { type: string }
        stock: { type: integer }
        image_url: { type: string, nullable: true }
        score: { type: number, description: "Vectorize similarity score, or 0 when the SQL LIKE fallback was used (Vectorize unreachable/no match)." }
        price_display: { type: string, example: "₹1,999" }

    CartLineItem:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        price: { type: integer, description: "paise, snapshotted at add time — never re-read from the live catalog price." }
        price_display: { type: string }
        quantity: { type: integer }

    CartResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CartLineItem" } }
        total: { type: integer, description: paise }
        total_display: { type: string }
        count: { type: integer, description: Total quantity across all line items. }
        budgetRemaining: { type: integer, nullable: true, description: "paise; null if the session has no budget set." }
        youMightAlsoLike:
          type: array
          description: |
            Up to 3 in-stock, in-category cross-sell suggestions, driven by
            categories already in the cart, falling back to the shopper's
            previous_products/purchase_history when the cart is empty. An
            empty array means there was no real signal to suggest from —
            never a fabricated recommendation.
          items:
            type: object
            properties:
              productId: { type: string }
              name: { type: string }
              price: { type: integer, description: paise }
              price_display: { type: string }
              category: { type: string }
              image_url: { type: string, nullable: true }

    CheckoutSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            orderId: { type: string, description: Razorpay order id. }
            amount: { type: integer, description: paise }
            paymentUrl: { type: string, nullable: true, description: "Absent if Razorpay's payment-link creation failed (e.g. test-mode quota) — the order is still valid." }
            status: { type: string, enum: [created, attempted] }

    OrderResponse:
      type: object
      properties:
        orderId: { type: string }
        status: { type: string, enum: [created, attempted, paid] }
        amount: { type: integer, description: paise }
